services:
  paper:
    image: eclipse-temurin:25-jre
    container_name: minicraft-teste
    working_dir: /srv
    command: ["java", "-Xms1G", "-Xmx3G", "-jar", "paper.jar", "--nogui"]
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:25566:25565"   # Minecraft Java (so este PC)
      - "127.0.0.1:25576:25575"   # RCON, usado pelos scripts
    volumes:
      - ./dados:/srv
